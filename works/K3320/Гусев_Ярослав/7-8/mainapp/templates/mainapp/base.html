<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Django проект{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header, footer { background-color: #f0f0f0; padding: 15px; text-align: center; }
        nav a { margin: 0 10px; text-decoration: none; color: #333; }
        nav a:hover { text-decoration: underline; }
        main { padding: 20px; }
        form { max-width: 400px; margin: auto; }
        label { display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 5px; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'mainapp:home' %}">Главная</a> |
            <a href="{% url 'mainapp:about' %}">О разработке</a> |
            <a href="{% url 'mainapp:contact' %}">Обратная связь</a>
        </nav>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        &copy; 2025 Django проект. Все права защищены.
    </footer>
</body>
</html>
